name: Desplegar frontend React en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localizar el proyecto React
        id: app
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f frontend/package.json ]; then
            echo "dir=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No se encontró package.json ni en la raíz ni en frontend/."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Construir
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          # CRA lee esta variable; Vite la ignora sin efectos.
          PUBLIC_URL: /Ren-employment
        run: |
          if ls vite.config.* >/dev/null 2>&1; then
            npm run build -- --base=/Ren-employment/
          else
            npm run build
          fi

      - name: Localizar la carpeta de salida
        id: out
        run: |
          BASE="${{ steps.app.outputs.dir }}"
          for d in dist build out; do
            if [ -d "$BASE/$d" ]; then
              echo "path=$BASE/$d" >> "$GITHUB_OUTPUT"
              echo "Build encontrado en $BASE/$d"
              exit 0
            fi
          done
          echo "::error::No se encontró carpeta de build (dist, build ni out)."
          exit 1

      - name: Preparar para servidor estático
        run: |
          # Pages usa 404.html como página de error: sirve de fallback
          # para las rutas del router al recargar una URL interna.
          cp "${{ steps.out.outputs.path }}/index.html" "${{ steps.out.outputs.path }}/404.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
